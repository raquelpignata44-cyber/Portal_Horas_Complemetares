<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Atividades</title>
    <link rel="stylesheet" href="registro-atividades.css">
</head>

<body>

    <main class="container glass3d">

        <header class="cabecalho">
            <h1>Registro de Atividades</h1>
            <p>Cadastre suas atividades complementares e envie seus certificados.</p>
        </header>

        <form id="formAtividade">

            <div class="campo campo-completo">
                <label for="nome">Nome da atividade</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo campo-completo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" required></textarea>
            </div>

            <div class="grupo-campos">
                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="Ensino">Ensino</option>
                        <option value="Pesquisa">Pesquisa</option>
                        <option value="Extensão">Extensão</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="tipoAtividade">Tipo de atividade</label>
                    <select id="tipoAtividade" name="tipoAtividade" required>
                        <option value="">Selecione primeiro uma categoria</option>
                    </select>
                </div>
            </div>

            <div class="grupo-campos grupo-datas">
                <div class="campo">
                    <label for="horasSolicitadas">Horas solicitadas</label>
                    <input type="number" id="horasSolicitadas"
                        name="horasSolicitadas" min="0.1" step="0.1" required>
                </div>

                <div class="campo">
                    <label for="dataInicio">Data de início</label>
                    <input type="date" id="dataInicio" name="dataInicio">
                </div>

                <div class="campo">
                    <label for="dataConclusao">Data de conclusão</label>
                    <input type="date" id="dataConclusao" name="dataConclusao">
                </div>
            </div>

            <div class="campo campo-completo campo-arquivo">
                <label for="certificado">Certificado em PDF</label>
                <input type="file" id="certificado"
                    name="certificado" accept="application/pdf" required>
            </div>

            <button type="submit">Cadastrar atividade</button>

        </form>

    </main>

    <script src="../js/dados.js"></script>
    <script src="registro-atividades.js"></script>

</body>
</html>
