<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Portal de Horas Complementares</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pagina-login">

        <img src="imagens/logo_UnDF.jpg" alt="Logo da UnDF" class="logo">

        <h1>Portal de Horas Complementares</h1>

        <p>Acompanhe suas horas complementares e de extensão.</p>

        <div class="caixa-login">

            <h2>Acesse seu portal:</h2>

            <form>
                <input type="email" id="email" placeholder="Informe seu e-mail" required>

                <input type="password" id="senha" placeholder="Informe sua senha" required>

                <button type="submit">Entrar</button>
            </form>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
